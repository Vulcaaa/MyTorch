# Selected speed configuration after the matched 100-epoch comparison.
# Paths are relative to this file. This protocol starts from scratch.
# On Linux, set OPENBLAS_NUM_THREADS=1 and OMP_NUM_THREADS=1 when reproducing timings.
version: 1
hypothesis: Batch 128 with learning rate 0.08 may preserve reference validation quality with faster epochs through the full training horizon.
seeds:
  - 43
datasets:
  train: ../../dataset/references/chess-v1/splits/train.txt
  validation: ../../dataset/references/chess-v1/splits/validation.txt
  split_metadata: ../../dataset/references/chess-v1/splits/split_info.json
configurations:
  - name: reference-b128-lr008
    network: ../networks/basic-network.yml
    overrides:
      learning_rate: 0.08
training:
  command: builtin
  settings:
    epochs: 500
    batch_size: 128
    patience: 20
    min_delta: 0.0001
